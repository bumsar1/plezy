# Fork-only: analyze and test the fork's own Dart code on feature branches,
# with upstream main merged in, before it lands on main.
name: Fork check

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/edde746/plezy.git

jobs:
  check:
    if: github.repository != 'edde746/plezy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main
        id: merge
        run: |
          git fetch --no-tags "$UPSTREAM_REPO" main
          git -c user.name=fork-ci -c user.email=fork-ci@localhost merge --no-edit FETCH_HEAD
          echo "flutter_version=$(sed -n 's/^ *FLUTTER_VERSION: *"\([^"]*\)".*/\1/p' .github/workflows/build.yml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.merge.outputs.flutter_version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      # Whole-app analysis, so a fork edit that breaks an upstream file fails here
      # rather than in the nightly build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test fork code
        run: flutter test test/services/jimaku
